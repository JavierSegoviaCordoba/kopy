name: build-kotlin

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  build:
    uses: JavierSegoviaCordoba/reusable-workflows/.github/workflows/build-kotlin.yaml@964eca446097aa7c9da0b8f0304a09a2eef5354f # main
    with:
      allow-github-actor-bots: false
      deploy-docs: false
      publish-snapshot: true
      run_before_args: './gradlew assemble publishToMavenLocalTest'
    secrets: inherit
